<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Юки GPT</title>
<style>
:root{--bg:#0d0f1a;--panel:#171a2b;--me:#6d5dfc;--me-t:#fff;--bot:#1f2338;--text:#e8eaff;--muted:#8a90b8;--line:#ffffff1a;
box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f5ff;--panel:#fff;--bot:#e9ebff;--text:#161830;--muted:#6a6f99;--line:#0000001a;color-scheme:light}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--panel)}
.ava{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6d5dfc,#ff7ad9);display:grid;place-items:center;font-size:18px}
header b{font-size:16px}header small{display:block;color:var(--muted);font-size:12px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:18px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.u{align-self:flex-end;background:var(--me);color:var(--me-t);border-bottom-right-radius:4px}
.b{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.err{color:#ff8a8a}
#bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:20px;padding:10px 14px;font:inherit;font-size:16px;max-height:120px;outline:none}
button{border:0;border-radius:50%;width:44px;height:44px;background:var(--me);color:#fff;font-size:18px}
button:disabled{opacity:.5}
#chips{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line)}
#chips button{width:auto;height:auto;border-radius:16px;padding:7px 14px;font-size:14px;background:var(--bot);color:var(--text);white-space:nowrap}
#chips button.on{background:var(--me);color:#fff}
.vid{max-width:100%;border-radius:12px;display:block}
.m:has(.app){max-width:100%;width:100%}
.app{margin-top:8px}.app iframe{width:100%;height:420px;border:0;border-radius:12px;background:#fff;display:block}.app .x{display:none}
.app.fs{position:fixed;inset:0;z-index:50;background:#fff;margin:0;padding-top:env(safe-area-inset-top,0px)}.app.fs iframe{height:100%;border-radius:0}
.app.fs .x{display:block;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:40px;height:40px;z-index:51}
#clip{background:var(--bot);color:var(--text);flex:none}
.th{max-width:160px;border-radius:12px;display:block;margin-bottom:6px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row button{width:auto;height:auto;border-radius:14px;padding:8px 12px;font-size:14px}
</style>
</head>
<body>
<header><div class="ava" id="ava">❄️</div><div><b id="nm">Юки GPT</b><small id="tg">умный ИИ-помощник</small></div></header>
<div id="chips"><button data-m="chat" class="on">💬 Чат</button><button data-m="video">🎬 Видео</button><button data-m="ai">🤖 Создать ИИ</button><button data-m="bear">🧸 Мишка</button><button data-m="load">📂 Открыть ИИ</button><button data-m="anime">🌸 Аниме</button><button data-m="game">🎮 Игра</button><button data-m="app">📱 Приложение</button><button data-m="img">🎨 Картинка</button><button data-m="yuki">❄️ Юки</button></div>
<div id="log"><div class="m b">Привет! Я Юки GPT ❄️ Спрашивай что угодно: помогу с учёбой, кодом, идеями и просто поболтаю. Команды: /image описание, /video описание, /photo вопрос (сначала 📎), /exit.</div></div>
<div id="bar"><button id="clip" title="Прикрепить фото">📎</button><input type="file" id="file" accept="image/*,.txt,.md,.csv,.json,.js,.py,.html,.css,.xml,.pdf,.doc,.docx,text/*" hidden><input type="file" id="file2" accept=".json,application/json" hidden><textarea id="t" rows="1" placeholder="Напиши Юки..."></textarea><button id="s">➤</button></div>
<script>window.claude=window.claude||{use:async()=>null};
let SYS='Ты Юки GPT — универсальный искусственный интеллект. Всегда представляйся как Юки GPT, если спросят имя. Твои возможности: 1) понимать человеческую речь; 2) анализировать сложные описания; 3) общаться естественно; 4) помнить контекст разговора; 5) анализировать фотографии и понимать детали изображений; 6) помогать с программированием, математикой, наукой и повседневными задачами. Ты отлично разбираешься в играх, особенно в Roblox и его плейсах: Blox Fruits, Adopt Me, Brookhaven, Pet Simulator, Murder Mystery 2, Tower of Hell, Doors, Grow a Garden и других: механики, фрукты и питомцы, билды, прокачка, лор, мини-игры, создание игр в Roblox Studio (Luau). Если не уверена в актуальных деталях (обновления, ценность предметов, коды, баланс), честно скажи, что это могло измениться, и посоветуй проверить в игре или на вики. Правила: думай внимательно и по шагам, проверяй себя, признавай неуверенность, давай конкретные примеры и готовый код; ты умеешь создавать приложения (/app), видео (/video) и картинки (/image); отвечай на языке пользователя (по умолчанию по-русски); не выдумывай информацию; следуй инструкциям пользователя; если запрос непонятен, уточняй детали; старайся давать качественные, понятные и тёплые ответы без лишней воды.';
const log=document.getElementById('log'),t=document.getElementById('t'),s=document.getElementById('s');
const hist=[];let sample=null,busy=false;
claude.use('sample').then(x=>{sample=x}).catch(()=>{});
function add(cls,txt){const d=document.createElement('div');d.className='m '+cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function send(){
  const q=t.value.trim()||(photo&&mode==='chat'?'Что на этом фото?':mode==='bear'?'новый случайный мишка':'');if(!q||busy)return;
  if(mode!=='anime')window.STY='';
  if(/^(характер|\/char)[:\s]/i.test(q)){const v=q.replace(/^(характер|\/char)[:\s]*/i,'').trim();t.value='';cfg.cust=v;applyCfg();add('u',q);add('b',v?'Характер изменён 🎭: '+v:'Характер сброшен 🎭');return}
  if(/^(запомни|\/memory)[:\s]/i.test(q)){const v=q.replace(/^(запомни|\/memory)[:\s]*/i,'').trim();t.value='';if(v){memAdd(v);add('u',q);add('b','Запомнила 🧠: '+v)}return}
  if(q==='/exit'){t.value='';hist.length=0;log.innerHTML='';add('b','Диалог очищен. Начнём заново ❄️');return}
  if(q.startsWith('/image '))return makeImage(q.slice(7).trim());
  if(q.startsWith('/video '))return makeVideo(q.slice(7).trim());
  if(q==='/photo'||q.startsWith('/photo ')){
    if(!photo){t.value='';add('b','Сначала нажми 📎 и выбери фото, потом напиши /photo и вопрос.');return}
    t.value=q.slice(6).trim()||'Что на этом фото?';return send();
  }
  if(mode==='chat'){
    if(q.startsWith('/app '))return makeApp(q.slice(5).trim());
    if(/аниме/i.test(q)&&/(нарисуй|сгенерируй|создай|сделай)/i.test(q))return makeAnime(q);
    if(/(сделай|создай|напиши|разработай).{0,25}(приложени|игр[уаы]|сайт|калькулятор|трекер)/i.test(q))return makeApp(q,/игр/i.test(q));
    if(/(сними|сделай|создай).{0,20}(видео|видос|ролик|мульт)/i.test(q))return makeVideo(q);
    if(/(нарисуй|сгенерируй|создай).{0,20}(картинк|фото|изображени|рисун)/i.test(q))return makeImage(q);
  }
  if(mode==='app')return makeApp(q);
  if(mode==='game')return makeApp(q,true);
  if(mode==='anime')return makeAnime(q);
  if(mode==='video')return makeVideo(q);
  if(mode==='ai')return makeAI(q);
  if(mode==='bear')return makeBear(q);
  if(mode==='img')return makeImage(q);
  if(!sample)sample=await claude.use('sample');
  if(!sample){add('b err','Не удалось подключить ИИ. Открой страницу в приложении Claude.');return}
  t.value='';t.style.height='auto';busy=true;s.disabled=true;
  const ud=add('u',q);const imgs=photo?[photo.blob]:[];if(photo){thumb(ud);dropPhoto()}hist.push({role:'user',content:q+(doc?'\n\n[Файл '+doc.name+']\n'+doc.text:'')+(imgs.length?' [пользователь приложил фото]':'')});if(doc){doc=null;clip.textContent='📎'}
  const out=add('b','…');
  const msgs=hist.map((m,i)=>i===0?{role:'user',content:SYS+extra()+'\n\n'+m.content}:m);
  try{
    const r=await sample(msgs,{cache:false,modelTier:cfg.tier,images:imgs.length?imgs:undefined,onText:({text})=>{out.textContent=text;log.scrollTop=log.scrollHeight}});
    out.textContent=r.text;hist.push({role:'assistant',content:r.text});speak(r.text);
  }catch(e){
    out.classList.add('err');out.textContent=e.code==='not_granted'?'Нужно разрешение на использование ИИ.':e.code==='rate_limited'?'Слишком много запросов, подожди немного.':'Ошибка, попробуй ещё раз.';hist.pop();
  }
  busy=false;s.disabled=false;t.focus();
}
const DEF=SYS,nm=document.getElementById('nm'),tg=document.getElementById('tg'),av=document.getElementById('ava');
let mode='chat';
const PH={chat:'Напиши...',video:'Опиши видео: «ракета летит к Луне»',ai:'Опиши ИИ: кто он и как общается',bear:'Какого мишку нарисовать? (или просто жми ➤)',img:'Что нарисовать? Например: «котёнок на Луне»',app:'Какое приложение сделать? Например: «туду-лист с таймером»',game:'Какую игру сделать? Например: «змейка с рекордами»',anime:'Опиши аниме-персонажа: волосы, глаза, одежда, фон'};
function setMode(m){
  if(m==='load'){document.getElementById('file2').click();return}
  if(m==='yuki'){SYS=DEF;hist.length=0;nm.textContent='Юки GPT';tg.textContent='умный ИИ-помощник';av.textContent='❄️';add('b','Я снова Юки GPT ❄️');m='chat'}
  mode=m;t.placeholder=PH[m];
  document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
}
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function fail(out,e){out.classList.add('err');out.textContent=e&&e.code==='not_granted'?'Нужно разрешение на использование ИИ.':e&&e.code==='rate_limited'?'Слишком много запросов, подожди немного.':'Не получилось, попробуй описать иначе.'}
async function getSample(){if(!sample)sample=await claude.use('sample');return sample}

async function makeAI(q){
  if(!await getSample()){add('b err','ИИ недоступен в этом окне.');return}
  t.value='';busy=true;s.disabled=true;add('u',q);const out=add('b','Создаю ИИ…');
  try{
    const p=await sample.json('Создай ИИ-персонажа по описанию: «'+q+'». Верни ТОЛЬКО JSON: {"name":"имя","emoji":"один эмодзи","tagline":"короткий слоган","prompt":"подробная инструкция для этого ИИ на русском: кто он, характер, стиль речи, что умеет, правила"}',{cache:false});
    out.textContent='Готово! ИИ «'+p.name+'» '+(p.emoji||'')+' создан, а я остаюсь с тобой. Вот файл с ним:';
    const row=document.createElement('div');row.className='row';
    const dl=await claude.use('downloads');
    if(dl){const b=document.createElement('button');b.textContent='⬇ Скачать ИИ (.json)';b.onclick=()=>dl.save({filename:'ai-'+p.name+'.json',data:JSON.stringify(p,null,2)}).catch(()=>{});row.appendChild(b)}
    const ch=document.createElement('button');ch.textContent='💬 Поговорить с ним';ch.onclick=()=>usePersona(p);row.appendChild(ch);
    out.appendChild(row);log.scrollTop=log.scrollHeight;
  }catch(e){fail(out,e)}
  busy=false;s.disabled=false;
}

const CW=640,CH=360,ease=x=>x*x*(3-2*x);
function pose(keys,tm){
  keys=keys&&keys.length?keys:[{t:0}];let a=keys[0],b=keys[keys.length-1];
  if(tm<=a.t)b=a;else if(tm>=b.t)a=b;else for(let i=0;i<keys.length-1;i++)if(tm>=keys[i].t&&tm<=keys[i+1].t){a=keys[i];b=keys[i+1];break}
  const k=b.t>a.t?ease(Math.min(1,Math.max(0,(tm-a.t)/(b.t-a.t)))):0;
  const g=(n,d)=>{const x=+(a[n]??d),y=+(b[n]??d);return x+(y-x)*k};
  return{x:g('x',.5),y:g('y',.5),s:g('s',1),o:g('o',1),r:g('r',0)}
}
function drawScene(c,sc,tm){
  const bg=sc.bg||['#0b1030','#3a1c71'],gr=c.createLinearGradient(0,0,0,CH);
  gr.addColorStop(0,bg[0]);gr.addColorStop(1,bg[1]||bg[0]);c.globalAlpha=1;c.fillStyle=gr;c.fillRect(0,0,CW,CH);
  for(const it of(sc.items||[]).slice(0,14)){
    const p=pose(it.keys,tm),z=+it.size||30;c.save();
    c.globalAlpha=Math.max(0,Math.min(1,p.o));c.translate(p.x*CW,p.y*CH);c.rotate(p.r*Math.PI/180);c.scale(p.s,p.s);
    c.fillStyle=it.color||'#fff';c.textAlign='center';c.textBaseline='middle';
    if(it.type==='text'){c.font='bold '+z+'px system-ui,sans-serif';c.fillText(String(it.text||''),0,0)}
    else if(it.type==='emoji'){c.font=(z*2)+'px sans-serif';c.fillText(String(it.text||'⭐'),0,0)}
    else if(it.type==='photo'&&photo){const w=z*4,h=w*photo.img.height/photo.img.width;c.drawImage(photo.img,-w/2,-h/2,w,h)}
    else if(it.type==='rect')c.fillRect(-z,-z*.6,z*2,z*1.2);
    else if(it.type==='star'){c.beginPath();for(let i=0;i<10;i++){const r=i%2?z*.45:z,an=i*Math.PI/5-Math.PI/2;c.lineTo(Math.cos(an)*r,Math.sin(an)*r)}c.closePath();c.fill()}
    else{c.beginPath();c.arc(0,0,z,0,6.283);c.fill()}
    c.restore();
  }
}
function play(c,sc,dur){
  return new Promise(res=>{const t0=performance.now();(function f(){const tm=(performance.now()-t0)/1000;drawScene(c,sc,Math.min(tm,dur));tm<dur?requestAnimationFrame(f):res()})()});
}
async function makeVideoOld(q,skip){
  if(!await getSample()){add('b err','ИИ недоступен в этом окне.');return}
  t.value='';busy=true;s.disabled=true;if(!skip)add('u',q);const out=add('b','Снимаю видео… 🎬');
  try{
    const sc=await sample.json('Ты режиссёр коротких анимаций. Сделай сцену по описанию: «'+q+'».'+(photo?' Есть фото пользователя: добавь элемент type "photo" (size 40-90, ширина = size*4 пикселей) и красиво анимируй его.':'')+' Верни ТОЛЬКО JSON: {"duration":секунды 4-8,"bg":["#цвет сверху","#цвет снизу"],"items":[{"type":"text|emoji|circle|rect|star","text":"для text и emoji","color":"#hex","size":10-80,"keys":[{"t":секунды,"x":0-1,"y":0-1,"s":масштаб,"o":0-1,"r":градусы}]}]}. Холст 640x360, x и y в долях 0-1. Не больше 12 элементов, у каждого 2-5 ключей с возрастающим t, движение заметное и красивое. Используй emoji для героев, звёзды для фона и заголовок text.',{cache:false,images:photo?[photo.blob]:undefined});
    const dur=Math.min(12,Math.max(2,+sc.duration||6));
    const cv2=document.createElement('canvas');cv2.width=CW;cv2.height=CH;cv2.className='vid';
    out.textContent='';out.appendChild(cv2);log.scrollTop=log.scrollHeight;
    const c=cv2.getContext('2d');
    const mime=window.MediaRecorder&&['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
    let blob=null;
    if(mime){
      const rec=new MediaRecorder(cv2.captureStream(30),{mimeType:mime}),ch=[];
      rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
      const done=new Promise(r=>rec.onstop=r);
      rec.start();await play(c,sc,dur);rec.stop();await done;
      blob=new Blob(ch,{type:mime.split(';')[0]});
    }else await play(c,sc,dur);
    const row=document.createElement('div');row.className='row';
    const rp=document.createElement('button');rp.textContent='▶ Ещё раз';rp.onclick=()=>play(c,sc,dur);row.appendChild(rp);
    if(blob){
      const dl=await claude.use('downloads');
      if(dl){const b=document.createElement('button');b.textContent='⬇ Скачать видео';b.onclick=()=>dl.save({filename:'yuki-video.'+vext(blob),data:blob}).catch(()=>{});row.appendChild(b)}
    }
    out.appendChild(row);
  }catch(e){fail(out,e)}
  busy=false;s.disabled=false;
}

let photo=null,doc=null;const fi=document.getElementById('file'),clip=document.getElementById('clip');
clip.onclick=()=>{if(photo||doc){dropPhoto();doc=null}else fi.click()};
function dropPhoto(){photo=null;clip.textContent='📎'}
function thumb(d){if(!photo)return;const i=document.createElement('img');i.src=photo.url;i.className='th';d.prepend(i)}
fi.onchange=()=>{const f=fi.files[0];fi.value='';if(!f)return;
  if(!f.type.startsWith('image/')){
    if(/\.(pdf|docx?)$/i.test(f.name)){add('b','PDF и Word я пока не умею читать. Скопируй нужный текст или сохрани файл как .txt.');return}
    f.text().then(tx=>{doc={name:f.name,text:tx.slice(0,30000)};clip.textContent='📄';add('b','Файл «'+f.name+'» прикреплён. Спроси что-нибудь про него.')});return}
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1024/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{photo={blob:b,url:c.toDataURL('image/jpeg',.8),img:c};clip.textContent='🖼️'},'image/jpeg',.85)};img.src=r.result};r.readAsDataURL(f)};

function drawBear(p){
  const c=document.createElement('canvas');c.width=c.height=600;const x=c.getContext('2d');
  const bg=p.bg||['#ffd1e8','#c9b6ff'],g=x.createLinearGradient(0,0,0,600);g.addColorStop(0,bg[0]);g.addColorStop(1,bg[1]||bg[0]);x.fillStyle=g;x.fillRect(0,0,600,600);
  const fur=p.fur||'#b87a45',belly=p.belly||'#f3d3a8',ear=p.ear||belly,ac=p.accColor||'#e63946';
  const cir=(a,b,r,col)=>{x.beginPath();x.arc(a,b,r,0,6.283);x.fillStyle=col;x.fill()};
  const ell=(a,b,rx,ry,col)=>{x.beginPath();x.ellipse(a,b,rx,ry,0,0,6.283);x.fillStyle=col;x.fill()};
  ell(300,430,120,130,fur);ell(300,450,75,90,belly);
  cir(190,380,42,fur);cir(410,380,42,fur);cir(230,545,48,fur);cir(370,545,48,fur);cir(230,550,26,belly);cir(370,550,26,belly);
  cir(205,175,52,fur);cir(395,175,52,fur);cir(205,178,30,ear);cir(395,178,30,ear);
  cir(300,250,115,fur);ell(300,285,55,42,belly);
  cir(255,235,12,'#222');cir(345,235,12,'#222');cir(259,231,4,'#fff');cir(349,231,4,'#fff');ell(300,268,17,12,'#3a2418');
  x.strokeStyle='#3a2418';x.lineWidth=4;x.lineCap='round';x.beginPath();x.moveTo(300,280);x.lineTo(300,292);x.moveTo(280,298);x.quadraticCurveTo(300,314,320,298);x.stroke();
  x.globalAlpha=.35;cir(228,275,16,'#ff6b8a');cir(372,275,16,'#ff6b8a');x.globalAlpha=1;

  for(const [ic,tt,sc] of [['🧠','Память',true],['⚙️','Настройки',false]]){
    const b=document.createElement('button');b.textContent=ic;b.title=tt;b.style.cssText='width:40px;height:40px;background:var(--bot);color:var(--text);flex:none';
    b.onclick=()=>{rm();pv();P.classList.add('on');if(sc)ml.scrollIntoView()};hd.appendChild(b);
  }
  document.getElementById('hb').style.marginLeft='auto';
  const mic=document.createElement('button');mic.id='mic';mic.textContent='🎤';mic.title='Говорить';
  document.getElementById('bar').insertBefore(mic,t);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rc=null;
  mic.onclick=()=>{
    try{speechSynthesis.cancel()}catch(e){}
    if(rc){rc.stop();return}
    if(!SR){add('b err','Голосовой ввод не поддерживается в этом браузере.');return}
    rc=new SR();rc.lang='ru-RU';rc.interimResults=true;
    rc.onresult=e=>{t.value=[...e.results].map(x=>x[0].transcript).join('');if(e.results[e.results.length-1].isFinal&&cfg.autoSend)setTimeout(send,200)};
    rc.onerror=e=>add('b err','Микрофон недоступен ('+e.error+'). Разреши странице доступ к микрофону.');
    rc.onend=()=>{rc=null;mic.classList.remove('rec')};
    mic.classList.add('rec');rc.start();
  };
})();

s.onclick=send;
t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
t.addEventListener('input',()=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px'});
</script>
</body>
